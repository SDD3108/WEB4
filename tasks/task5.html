<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>
<body>
    <section class="flex justify-center items-center">
        <div class="mt-8">
            <h2 class="font-bold">2. Online Store</h2>
            <form action="" class="">
                <div class="flex flex-col">
                    <label for="text">Quantity:</label>
                    <input type="text" class="py-2 px-3">
                </div>
                <div class="flex flex-col">
                    <label for="color">Product color:</label>
                    <input type="color" class="rounded-lg">
                </div>
                <div class="flex gap-2">
                    <input type="checkbox">
                    <label for="checkbox">I accept the terms</label>
                </div>
                <button class="bg-blue-600 py-2 px-4 rounded-md text-white">Order</button>
            </form>
        </div>
    </section>
</body>
</html>
