<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-clifford: #da373d;
        }
    </style>
    <script src="../script/script.js" defer></script>
    <title>Document</title>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800">
    <header class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex max-w-4xl flex-wrap items-center justify-between gap-4 px-5 py-5">
            <a href="../index.html" class="font-semibold tracking-tight">Forms & Validation</a>
            <nav aria-label="Tasks" class="flex flex-wrap gap-1">
                <a href="../index.html" class="rounded-md px-3 py-2 text-sm text-slate-600 hover:bg-slate-100">Home</a>
                <a href="task1.html" class="rounded-md px-3 py-2 text-sm text-slate-600 hover:bg-slate-100">Task 1</a>
                <a href="task2.html" class="rounded-md bg-blue-50 px-3 py-2 text-sm font-medium text-blue-700" aria-current="page">Task 2</a>
                <a href="task3.html" class="rounded-md px-3 py-2 text-sm text-slate-600 hover:bg-slate-100">Task 3</a>
                <a href="task4.html" class="rounded-md px-3 py-2 text-sm text-slate-600 hover:bg-slate-100">Task 4</a>
            </nav>
        </div>
    </header>
    <main class="mx-auto max-w-2xl px-5 py-10">
        <p class="mb-2 text-xs font-semibold uppercase tracking-widest text-blue-700">Task 2</p>
        <h1 class="text-3xl font-bold tracking-tight text-slate-900">Styled contact form</h1>
        <p class="mt-3 text-sm leading-6 text-slate-600">Have a question? We would like to hear from you</p>
        <section aria-label="Styled contact form" class="mt-7 rounded-xl border border-slate-200 bg-white p-5 sm:p-8">
            <p class="mb-6 text-sm text-slate-500">All fields are required</p>
            <form data-mode="native">
                <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
                    <div>
                        <label for="name" class="text-sm font-medium text-slate-700">Name</label>
                        <input id="name" name="name" type="text" class="mt-2 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100" required maxlength="80" autocomplete="name" placeholder="Your name">
                    </div>
                    <div>
                        <label for="email" class="text-sm font-medium text-slate-700">Email</label>
                        <input id="email" name="email" type="email" class="mt-2 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100" required autocomplete="email" placeholder="you@gmail.com">
                    </div>
                    <div class="sm:col-span-2">
                        <label for="message" class="text-sm font-medium text-slate-700">Message</label>
                        <textarea id="message" name="message" rows="5" class="mt-2 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100" required maxlength="1000" placeholder="How can we help?"></textarea>
                    </div>
                    <p class="-mt-3 text-xs text-slate-500 sm:col-span-2">Please keep your message under 1,000 characters</p>
                </div>
                <div class="mt-7 flex flex-wrap gap-3">
                    <button type="submit" class="rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">Send message</button>
                </div>
                <p data-status role="status" class="mt-5 text-sm font-medium text-green-700"></p>
            </form>
        </section>
    </main>
    <footer class="mx-auto p-5 text-xs text-slate-500 border-t flex items-center justify-center">
        <p>Satimov Damir · SE-2525 · Assignment 4</p>
    </footer>
</body>
</html>
